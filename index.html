<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Sorter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f9;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="number"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            padding: 10px;
            background-color: white;
            margin-bottom: 5px;
            border-radius: 4px;
            border-left: 5px solid #007bff;
            font-size: 18px;
            font-weight: bold;
        }
        .controls {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }
        .clear-btn {
            background-color: #dc3545;
        }
        .clear-btn:hover {
            background-color: #bd2130;
        }
    </style>
</head>
<body>

    <h2>Number Sorter</h2>
    
    <div class="input-group">
        <input type="number" id="numberInput" placeholder="Type a number...">
        <button onclick="addNumber()">Add</button>
    </div>

    <ul id="numberList"></ul>

    <div class="controls">
        <button class="clear-btn" onclick="clearList()">Clear All</button>
    </div>

    <script>
        // Array to store the numbers
        let numbers = [];

        // Listen for the "Enter" key in the input field
        document.getElementById('numberInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                addNumber();
            }
        });

        function addNumber() {
            const input = document.getElementById('numberInput');
            const value = parseFloat(input.value);

            // Check if the input is a valid number
            if (!isNaN(value)) {
                // Add the number to our array
                numbers.push(value);
                
                // Sort the array from lowest to highest
                numbers.sort((a, b) => a - b);
                
                // Refresh the display
                updateList();
                
                // Clear the input field and refocus
                input.value = '';
                input.focus();
            }
        }

        function updateList() {
            const listElement = document.getElementById('numberList');
            // Clear the current visual list
            listElement.innerHTML = '';

            // Add each sorted number to the screen
            numbers.forEach(num => {
                const li = document.createElement('li');
                li.textContent = num;
                listElement.appendChild(li);
            });
        }

        function clearList() {
            numbers = [];
            updateList();
        }
    </script>

    }
</script>

</body>
</html>
